name: CI

on:
    push:
        paths-ignore: ["**.md"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    rust-build:
        uses: ./.github/workflows/rust-build.yml

    prek:
        uses: ./.github/workflows/prek.yml

    success:
        name: Check success
        needs: [rust-build, prek]
        if: always()
        runs-on: ubuntu-slim
        env:
            NEEDS: ${{ toJSON(needs) }}
        steps:
            - name: Print all results
              run: echo "$NEEDS"
            - name: Exit if any failures or cancellations
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1
