name: Prek

on:
    workflow_call:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    prek:
        name: Prek
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
              with:
                  tool: cargo-deny,cargo-machete,cargo-sort

            - name: Run Prek
              uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
              with:
                  extra-args: "--all-files --skip sqlx-prepare-check"
